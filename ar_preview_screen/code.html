<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AR Car Viewer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden group/design-root">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-20">
<div class="text-slate-800 dark:text-white flex size-12 shrink-0 items-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-800 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Model S Plaid</h2>
<div class="flex w-12 items-center justify-end">
<!-- Placeholder for potential right-side icon -->
</div>
</div>
<!-- Header Image (3D Model Placeholder) -->
<div class="px-4 py-3 @container">
<div class="w-full bg-center bg-no-repeat bg-contain flex flex-col justify-end overflow-hidden bg-transparent min-h-80" data-alt="A 3D render of a silver Tesla Model S Plaid against a dark background." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDfJS0TBQT5IO72x0vD1Wxa3DQ9aqYjSN_9iCUch9lyuF1Q1hQJfbrn5CqFNoSVXiqMTc19vWRZRbpD1DwASa6LWCtvaPYoGdFjfcPpn1hSwOfeU8LedN_-I7SJNxHnRMDA0i-Mymo5bQe6Q9zcisOluFO2XcI9UWa_f_82-TZBWn-aCGCdglfk0ujFwMmTfFBnu_S5e4z1DEccvp3o5JN3lAHMePMF8cetDHMrTqmhzDRkOnFfHjF0EEdMubqu2iWhgxLAVT4JgmTz");'>
</div>
</div>
<!-- Car Details Card -->
<div class="px-4 py-2 @container">
<div class="flex flex-col items-stretch justify-start rounded-xl">
<div class="flex w-full min-w-72 grow flex-col items-stretch justify-center gap-1 py-4">
<p class="text-slate-800 dark:text-white text-3xl font-bold leading-tight tracking-[-0.015em]">Tesla Model S Plaid</p>
<div class="flex items-end gap-3 justify-between">
<div class="flex flex-col gap-1">
<p class="text-slate-600 dark:text-[#92a4c9] text-base font-normal leading-normal">All-Electric Powertrain</p>
</div>
</div>
</div>
</div>
</div>
<!-- Description List -->
<div class="px-4 pb-4 grid grid-cols-2 gap-x-2">
<div class="flex flex-col gap-1 border-t border-solid border-slate-200 dark:border-t-[#324467] py-4 pr-2">
<p class="text-slate-500 dark:text-[#92a4c9] text-sm font-normal leading-normal">Range</p>
<p class="text-slate-800 dark:text-white text-base font-bold leading-tight">396 mi (est.)</p>
</div>
<div class="flex flex-col gap-1 border-t border-solid border-slate-200 dark:border-t-[#324467] py-4 pl-2">
<p class="text-slate-500 dark:text-[#92a4c9] text-sm font-normal leading-normal">Top Speed</p>
<p class="text-slate-800 dark:text-white text-base font-bold leading-tight">200 mph</p>
</div>
<div class="flex flex-col gap-1 border-t border-solid border-slate-200 dark:border-t-[#324467] py-4 pr-2">
<p class="text-slate-500 dark:text-[#92a4c9] text-sm font-normal leading-normal">0-60 mph</p>
<p class="text-slate-800 dark:text-white text-base font-bold leading-tight">1.99 s</p>
</div>
<div class="flex flex-col gap-1 border-t border-solid border-slate-200 dark:border-t-[#324467] py-4 pl-2">
<p class="text-slate-500 dark:text-[#92a4c9] text-sm font-normal leading-normal">Seating</p>
<p class="text-slate-800 dark:text-white text-base font-bold leading-tight">5 Adults</p>
</div>
</div>
<div class="flex-grow"></div>
<!-- Sticky Bottom Section -->
<div class="sticky bottom-0 p-4 bg-background-light dark:bg-background-dark">
<!-- Launch AR Button -->
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary h-14 px-6 text-white text-base font-bold leading-normal">
<span class="material-symbols-outlined">view_in_ar</span>
<span class="truncate">Launch AR</span>
</button>
</div>
<!-- Instructions Popup (Glassmorphism Overlay) -->
<div class="absolute inset-0 z-30 flex items-center justify-center bg-black/50 p-4 backdrop-blur-md">
<div class="flex flex-col items-center justify-center gap-6 rounded-xl border border-white/20 bg-white/10 p-6 text-center max-w-sm">
<div class="flex size-16 items-center justify-center rounded-full bg-primary">
<span class="material-symbols-outlined text-white text-4xl">view_in_ar</span>
</div>
<div class="flex flex-col gap-2">
<p class="text-white text-xl font-bold leading-tight">Find a Flat Surface</p>
<p class="text-slate-300 dark:text-[#92a4c9] text-base font-normal leading-normal">Point your camera at a well-lit, flat surface like the floor to place the car.</p>
</div>
<button class="flex w-full min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-primary text-white text-base font-medium leading-normal">
<span class="truncate">Got It</span>
</button>
</div>
</div>
</div>
</body></html>
